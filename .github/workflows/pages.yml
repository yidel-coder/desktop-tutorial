# Deploys the static site to GitHub Pages on every push to main.
# data/ in main is the small demo build. The real national dataset (~800 MB) lives on the orphan `data` branch,
# which build.py output is force-pushed to; this workflow swaps it in at deploy time. GitHub Pages allows 1 GB.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the real national dataset from the data branch (if present)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            rm -rf data
            git fetch --depth=1 origin data
            git worktree add data FETCH_HEAD
            rm -rf data/.git data/README.md
            echo "Using data branch: $(python3 -c 'import json;print(json.load(open("data/meta.json"))["flows_label"])')"
          elif [ ! -f data/meta.json ]; then
            python3 build.py --demo
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The artifact carries the ~800 MB national dataset; Pages can take longer than the 10-minute default to sync it.
          timeout: 1800000
