# Deploys the static site to GitHub Pages on every push to main.
# The data/ folder must be committed (demo build, or a real build small enough for git).
# For a full national build (1-3 GB), host data/ on object storage and set dataBase in index.html instead.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build demo data if data/ is missing
        run: |
          if [ ! -f data/meta.json ]; then python3 build.py --demo; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
